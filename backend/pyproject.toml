[project]
name = "compute-market-p2p-backend"
version = "0.1.0"
description = "去中心化AI算力共享市场后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "minio>=7.2.0",
    "docker>=7.0.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "fakeredis>=2.23.0",
    "factory-boy>=3.3.0",
    "testcontainers>=4.7.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "ASYNC"]
ignore = ["S101", "S106", "S302", "S306", "S307", "S310", "S311", "S603", "S607", "PLC0415", "UP042", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# 测试断言用魔法数字、辅助函数参数多、pytest fixture 参数名必须匹配但未必使用
"tests/*" = ["S101", "S106", "PLR2004", "PLR0913", "PLR0917", "ARG001"]
# FastAPI 依赖注入：Depends 位于参数默认值，依赖校验型参数未必直接使用
"app/api/v1/*" = ["B008", "ARG001", "PLR0913", "PLR0917"]
"app/core/deps.py" = ["B008"]
# 集中重导出文件：from ... import * + __all__
"app/schemas/__init__.py" = ["F403", "F405"]
# alembic 自动生成的迁移文件，保持原样
"alembic/versions/*" = ["E501"]
# 全局客户端单例模式
"app/core/redis_client.py" = ["PLW0603"]
"app/core/minio_client.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]